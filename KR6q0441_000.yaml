front:
  text: 荊州天王水鑑海和尚五會錄序余常謂聖賢危微之旨必待人而後傳故我儒之有薪傳猶釋氏之有統嗣也聖賢危微之傳必升堂而後入室我儒之有洙泗猶釋氏之有祖庭衣缽也聖賢之道非其人不傳釋氏之宗亦非其人不嗣聖賢之脈必由洙泗而溯其源釋氏之傳亦必由祖庭衣缽而正其統使其間無六經諸史以正其歸則聖賢之道不明無經典語錄以闡其教則佛氏之學不著甚矣語言文字之功為大且重也粵稽釋氏臨濟自西來後數千年間或顯或晦不絕如縷至密老人中興天童而其教始盛天童傳徑山徑山傳棲賢棲賢傳天王天王水鑑大和尚者即今真州地藏寺之開山禪祖也師自荷法後即以闡揚先教為己任因念荊南天王祖庭湮滅無聞天童常遣人求其址而未得繼而徑山承先人意作嚴統一書嚴統者嚴考其統嗣歸於嫡派以正其祖庭也師承兩老人意單瓢隻履奮然至荊求天王故址而昔日梵宮貝殿悉化為狐窟兔藪暫寓鐵佛寺不旬日荊人慕師教咸來瞻禮遂開席焉未幾得天王故址師大喜親為刈榛莽除荒穢庀材鳩工計日而就使千百年湮滅之祖庭一旦煥然復出遂移錫於天王寺是為天王中興云居數載師復念曰天王與黃龍俱為臨濟祖庭也何可開天王而舍黃龍乎復移錫鄂州更闢黃龍甫畢赴漢陽棲賢之席居未幾又受儀真地藏請師至地藏而儀人之慕風皈依捐貲修刱者亦如天王故事其教復大振嗚呼師真可謂有功於祖庭者哉二十年來歷吳入楚五開叢席其間一刱天王兩興黃龍地藏住錫之處靡不踊躍輻輳而又能在在皆有語錄以行於世茲門人更復將師五處所刻之錄刪繁訂略共為一帙名曰五會錄梓以傳世問序於余余覽之喟然曰嗟乎余何知敢漫然序哉既自思曰不知語錄之奧義而師之行履可知也師之語言文字可知也因為焚香拜讀覺洋洋纚纚如日月之周天而無時息也如江湖之朝宗而必歸於海也又如然犀剸艸而幽隱畢出葛藤斬盡也非師之文不足以發明佛氏之教非師之行不足以中興祖庭之遺然則師真可謂有功於祖庭者哉嗚呼余因是而增慨焉亦安得我儒者如師之承先啟後而使聖賢危微之旨復顯今日也嗚呼是真可慨也夫康熙壬子十月望日徐行檗菴氏拜撰荊州天王水鑑海和尚語錄序劉經臣明道篇曰世尊拈華而玅心傳於迦葉達磨面壁而宗旨付於神光六葉既敷千華競秀分宗別派各有門庭荊南天王禪師自貞元元和間振鈴鶴澤卓錫荊湖於時蔭法雲而曜慧日靡不出火宅而濯清涼迄今智炬雖微宗風不墜余以鞅掌之塵墮黑罡之海即欲息念金篦望津玄筏終愧門外未契箇中因入天王古寺得瞻水鑑和尚宛然天童法裔通真臨濟兒孫時叢桂飄香乃拈無隱公案幾如啞十說法木人對語嗣後讀其語錄恍然頓悟因思古德接機傳心諭法或瞬目揚眉擎拳舉指或行棒坐喝豎拂拈椎或挾矢持叉輥毬舞笏或拽石搬土掣劍磨磚靡不脫盡筌蹄直指機要以觀今日師之指點全體機用所謂一馬蹋殺方知獅子窟中梅子熟時誰識蓮華座上吹毛劍條條血痕塗毒鼓聲聲刺淚義味俱亡中邊甜徹當下透脫溷地圓成讀斯錄者自有醒焉余日坐煩惱障中正恐鞭鞴難施若謂打鼓弄琵琶愧是鈍漢湖廣荊州府推官葉南生拜撰荊州天王水鑑海和尚語錄序貞元元和間人間佛理悉顯宗風唯楚燈缽猶盛微直挺生其際鍾湘澤之靈者也一時荊湖鼎朗之間晃晃燈明如天王天皇龍潭藥德夾山諸方獰龍香象授衣付缽於其際者遂如日如月如星燦五葉兒孫幾半天下矣嗣是以還載微載著似以楚俗不勤修證不愛碑版而頓迷失之致令天王之裔盡屬天皇遂成淆訛向與報菴菴主東旭諸禪偶一考證慨然有如許兒孫猶迷卻祖父之歎夫卷冊易淆山水道場難沒即今天王城西天皇城東以別則十里而遙以確則一城而近而況龍潭德山晃晃照人間者乎今天王燿靈乃得沙翁和尚砍開荊棘中興道場日提拂玄唱其間於時法豕豚衝緇素雲涌師為資權顯實拔楔抽釘取合口猶塵者使人言下便見遂得語錄若干卷念荊人昔時宗風歇絕失迷衣珠再舉馬祖之機用所謂不歷漸次不假修持荊人信悟如天王親承說法矣師以余際世變山中結茅將謂此事亦有依俙不知世變後田荒賦累歲洊軍興無如皮囊何愧摸此中鼻孔不著矣聊為序緣起若此江陵報菴王文南熏沐拜書
