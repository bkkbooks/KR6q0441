body:
  text: 嗣法門人原澄等編贊金陵長干舍利寶塔有序舍利者何謂佛之真身也寶塔者何謂吳大帝所造函此真身也大帝初未信吾教適遇康僧會曰卿教何驗會曰吾佛舍利禱之即來遂命禱之三七日中不應會曰佛以慈悲為心苟不應則使此方衆生斷滅佛種矣於是痛舉佛號三稱即聽瓶中鏗然有聲啓之舍利宛在瓶中矣大帝與群臣聚觀歎曰希世之瑞也會曰舍利威神世間無能壞者大帝不信命力士擊之錘砧俱碎而舍利光明自若由是虔造琉璃寶塔函之特使人天瞻禮蓋佛以清淨熏修百劫無異成此金剛種性堅固無以比論常住世間饒益衆生況有求即應禱之來哉海獲瞻此寶相寧不製以伽陀贊之贊曰琉璃寶塔插長干內外光明耀日寒未信大雄身不壞卻從力士亂捶鑽修成智種無人見煉就金剛任爾看千聖萬靈同稽首贊之莫極一毫端明州鄮山阿育王舍利寶塔有序佛於曠大劫中修持金剛三昧至般涅槃得舍利八斛分為三分天上人間龍宮各起塔供養而人間八國分之阿闍世王得其一分有八萬四千顆至阿育王能役鬼神碎七寶末起八萬四千塔遍散四洲晉太康中有劉薩訶者身陷地獄將無出期乃聽梵僧指求舍利遂於鄮山哀懇三日寶塔從地涌出光明騰耀色青如石高尺四寸廣七寸露盤五層四角挺然中縣金鍾舍利綴於鍾下四繞俱是諸佛菩薩金剛聖僧八部等象精巧殊特非人能造海乙巳春親禮真身諦觀舍利大如芡實其光五色蕩漾不可迫視再觀如珠旋轉乃問從者書記何若曰黃色大如菉豆又問侍者曰緑色大如黍米又問行者曰無見曰再觀曰總無見嗚呼舍利一也何見有不同是知衆生業力熏蒸遮障輕重此一驗也佛以微妙功德應現世間隨機說法直指人人常光若也依俙不會豈不孤負大雄而又自昧本有哉於是稽首而說贊曰金仙隨類放光明驗盡衆生業重輕世上若無佛慧照直教大地作幽冥釋迦佛不出龍樓憔悴後何能遍界示金身諸魔漫自生瞋惱天上人間只一人文殊浩浩淵淵心未灰青獅騎著上高臺南方佛法如何說贏得玻璃茗一杯觀音補陀嵒下白華香歷歷聲聞不覆藏試問家家觀自在如何又向客途忙初祖百萬程途入此邦擬將大法授梁王不知反致身無著一葦蕭蕭又渡江咦不是熊山空脫去幾乎流落在他鄉六祖腰石黃梅踏碓夫如何作得祖規模至今面目難藏掩多少人來描畫圖咄休畫圖曹溪月滿一天孤天王悟馬祖八十四人師為傑出歸隱渚宮啓大爐韛崇信獻餅乃嗣其緒遂出兩宗震動天地有僧道原混師苗裔天下競爭徒勞心力況師道大如光如日節使拋水衣都不溼千古洪名欽僧史藉獨師道場鞠為荊棘愧余繼之乃舉百廢臨濟四大本無誰喫棒尚言拂著似蒿枝宗風從此傳天下都是滹沱百世師天童悟和尚道震太白兮開天下衲僧之眼目德播金粟兮破四方君子之執著燈續龍池兮起後代兒孫之殃禍寂歸通玄兮動遠近山林之訝噁不肖於今奚所之焚香稽首空王座徑山容和尚聖賢既作天秉人龍恢弘祖道力挽頽風蕩混淆於法亂之秋嚴統尚在誅邪解於濫觴之際別集猶存況師之德業洪遠所以是帝是王問道其子其孫末後光明兮通身舍利砌如鱗四山留塔兮巍巍千古鎮人寰四山黃檗福嚴金栗興陽沙翁自贊本懷上請師別號沙翁者富川子行年四十一無所能三坐道場說法十年往往垂鉤釣金鱗而不遇處處張弓射聖人以難逢非餌香之不妙蓋水清而無魚於今持汝西川去達本懷時方許渠又禪人請謂伊有所長兮見之也只鼻直而眼橫謂伊無所長兮聞者何故膽戰而心驚白棒一條整頓臨濟濫觴一時之法道赤手兩片中興天王湮沒千載之祖庭於今歸隱無方去且在人間作馬牛欲識勞生功業處荊州鄂州與揚州又覓之不可見猛然在目前離卻意忘卻言謝郎原在釣魚船師俗姓謝又咄哉者漢不合時宜呵叱學者痛排邪師謂今天下所學者無乃糟魄所說者總屬支離或人曰既今天下所學所說一皆如此而汝之道非止不師汝將恐削汝蹟伐汝樹且汝之言總是招怨惹非沙翁聞而喟然曰有是哉吾果不知時又戒秉雙徑法續棲賢眼空似海膽大如天熱罵古佛痛打飛仙而今休也收拾爐鉗浩歌歸來兮林下短笛橫吹兮水邊生涯無多兮自足曲股枕頭兮幽然又四大為身俱是假更來紙上託形模也須認取渠真面禮拜燒香意不孤又黃龍長老天王和尚聞名富貴見面郎當有時高談闊論疑他是戰國蘇張有時信筆而揮猜伊是張顛素狂日午長申兩腳眠夜深翦燭讀騷莊雖然自在還由己爭奈侍僧瞌睡慌又二十剃染三十開法四坐名坊奔上走下仲宣樓上作賦賦難佳黃鶴樓中題詩無好說更來騎鶴去揚州腰間銅錢無一百又衰殘髮已半垂霜那用描來挂法堂看遍人間無此漢息心未得氣昂昂又放憨放癡妝啞妝聾身披紫服手握青笻時而山上時而水中問渠何以欲釣獰龍咦夜靜水寒魚不食滿船明月載還空又富川樓上思歸切九頂山頭望杳然幾度攜囊還挈杖業緣羈絆不能旋於今衰朽脛無力難得波波光祖筵放我故園松菊下敲風打雨樂餘年又肝腸一副曾無遮蓋每與學者曰而汝參禪須是涅槃堂裏用得不可圖他舌便口滑知解文章妄擬玄旨而今非汝為然即乃匡徒領衆者要求親識鼻孔洞達宗乘不可多得苟住一剎機巧多般以支口體故沙翁年來無意於斯獨將白眼看人忙豈謂無法與人增吾為罪人哉更復組之繪之為軌為則而汝焚香稽首而我寧無愧於中乎又村僧村僧問伊何能業如山重福似羽輕不知律儀懶打葛藤開口見膽楂滓不存村僧村僧者樣行狀那好載上傳燈又自從飯後通消息處處逢渠無暫時雙徑報恩住不歇更來持鉢入龍池道峰金粟曾留榻末後靈山也太癡有便宣沒便宣觀他天上月輪孤失卻手中橈一枝騎牛老君老聃道不行騎牛入函谷苟非遇關尹道德何所屬雖死在方外未免秦失哭咄猶龍一語聲難卒鍾馗進士明皇晝夢爾為鬼藍袍著身劍手舉欲除天下虛耗孽致使人人無恙苦為鬼尚然有此心為士如何反害人天真秀才凡人立於天下者形也形之能舉動者真也真兮真兮其誰與并兮萬物壞兮渠不朽兮東坡居士山色溪聲蘇子之面目常在玉帶鎮金山坡老之法施猶存若黃州惠州瓊州乃其塵垢不足為道況其行為天下法言為百世師苟非祖位重來開覺生民者安得有斯人為一遇哉坡為五祖戒禪師後身莊子謂汝以有心兮既見詔而何不遊梁謂汝以無心兮何囂囂然著書以詆侮賢良豈物之不齊而有言兮以斯道諭一馬而全彰莫庖之技進而無全牛兮乃心浩浩而口洋洋即子之言以為贊兮大覺莊周萬世一遇其猶旦暮者也詩偈登大別山漢陽樹色為誰栽春雨春風一杖開煙火萬家忙不徹幾人撒手問心來登漢陰山曾聞抱甕息機心恥辱大賢賜也深芳草落華春再至行人舉眼漫沉吟登晴川樓西望瀟湘意未休乾坤萬里一登樓襄王雲夢清思斷神女於今待孰游登黃鶴樓重構危樓接太清等閒登眺小天人只知身在白雲上不識世間有垢塵游玉泉寺十載相思夢亦牽偷閒驅馬到蕭然陵空鐵塔青天破沁谷玉泉白石穿橋斷雲邊忘故蹟碑殘草裏憶先年皓公諸祖今何在擁目堆藍起暮煙鬼谷洞天然一種難描貌想是洪濛先有渠喜爾真人居甚樂名高何必帶金魚青溪張儀蘇秦曾問道因他鬼谷悟真人至今溪水流無異不見仙翁寂莫身登仲宣樓何事憂心不放開登樓作賦亦悲哀才高爭若眼空者一望章華成劫灰登沙市寶塔覽勝閒登塔戶開楚天寥闊獨徘徊風煙萬頃含孤照無限游人空手回初至荊游天王寺遺址有鐘被火化為塊鐵人屢竊卒雷雨驚退劫火焚時鐘獨鳴私心敢用自雷驚江干常對清波涌殿閣空餘春草生千古淵源分兩脈一朝勝事付全傾蕭蕭轉盼荒煙晚諸子扶歸竹杖輕梅華十詠次古韻古題尋梅為憶南枝暢玉神摳衣帶霧夢魂真行吟信步白雲裏悵望平欺紅粉人凍蕊飄香依壑樹疏林凝碧隔風塵感思臥雪殷勤者令我空山惜遠春臘梅占斷群芳最有神一回霜傲一回真半窗疏影黃昏月滿樹輕妝金襲人孰共寒姿情淡淡孤陳瘦骨絶塵塵清香幾度隨風去贏得西湖兩岸春早梅嚴風幾歷轉精神剛得陽和態自真雪色欲迷尋艷鶴暗香多醉玩華人羅浮夢破山山月姑射煙含樹樹塵堪惜當年何遜子肯將情戀廣陵春全放梅傲骨藏聲似有神被霜帶月自幽真不齊群卉棲凡鳥全放瓊華醒夢人老幹參差蒼翠迥玉條長短豈侵塵沉吟難盡其中意聊泄枝頭一點春茅舍梅寂寥茅舍冷精神幸有冰華可慰真香動石邊浮細草影流溪畔逐漁人歲寒豈畏三更月枯淡難生世外塵獨恨翠禽偷瓣去五湖盡作碧壺春庭梅不棲嵒壑隱芳神唯占丹庭樹樹真入枕香魂驚化蝶隔簾明月動愁人瑤琴白晝多幽興玉磬清宵徹遠塵只為憑闌惜雅態青衫染得十分春西湖梅高樓獨上望華神兩岸寒芳碧水真雪散渾忘三竺寺風生愁殺六橋人戍歌處處關山月細雨霏霏灑玉麈漫謂江南消息杳蘇隄香冷幾回春山中梅冰肌裊裊太多神不待輕妝趣自真冉冉光迷南嶺客沉沉香拂北窗人唯堪幽谷生平老豈染雲間半點塵分付狂蜂與蛺蝶漫來枝上弄仙春玉笛梅笛聲何處卻多神飄遞江南韻自真幾點疏華雲外鷺一腔煙粉鏡中人玉樓夢斷關山遠竹榻魂飛散入塵莫是武昌三弄者蕭然五月落寒春觀梅孤標獨占百華神幾度觀來幾度真片片白雲清夢眼層層翠浪動詩人胸中浩蕩吐新句筆下風流破玉麈不是鐵心寒徹底爭知別有一般春天王偶成畫棟鋪雲曉色新華堂帶雨翠粼粼青松緑竹閒栽遍鳳舞龍翔勝舊春挂笠吟有序余挂笠荊南十又一年所覓天王遺址一朝從草萊中而得驅狼逐豹庀木興工殿閣廊廡粗以構就碑版銘記與夫所宣之物亦乃備焉原以先天童先徑山未了之案余乃繼之其帶曉披星悍勞忍苦雖是為人所當為實乃為報二先人之大慈恩也信菴禪人領造洪鐘五火方就心亦良苦特成五詩以發緒言蓋見挂笠之事如此鉗錘幾歷出頭來贏得清音遍九垓通報五湖學道者聞時須覺眼雙開風流徹體顯圓音一點無塵表素心天上人間誰箇似清機撥著動沉吟拖泥帶水出胞胎勢壓諸方吼法雷繼起五宗兩祖脈兒孫常憶信公來祖席重光振楚荊五湖唯有一清聞徑山嚴統炳然著南嶽青原廓爾分十載殷勤絶曉昏祖庭恢復報師恩而今功業稍稍備護惜全然賴後昆挂鐘不受紅爐幾鍛煉何能全體有光輝於今要作出頭漢再上一重發大機天童掃悟和尚塔撥開雲路上玲瓏澗水溪華觸祖翁撅起當年河北令千枝萬派出天童壬寅秋歸鄂州富川祭掃先塋有感當年何事出鄉關今日思惟實汗顏杯茗不堪為大供簪纓換得衲衣還歸富川寓興曠寺因人事繁作野外人歸興曠寺憧憧夾道往來忙諸賢要見沙翁面還是從前謝十郎歸山吟有序余住維揚地藏之四年歲維乙巳天王禪人以余年值不惑敦迎還荊明年春王二月謀之巨石於寺西天王山前樹立塔幢藏余朽骨方形七級高一十二尺廣七尺四角金剛前列獅像左右雕以羽族華芳之屬又造脅山殿覆之余念德涼難以克當諸禪人乃進曰天王道場傾廢千年而師一旦重新又荊自宋元明以來久不知禪今乃有歸亦師開闢其地其人實師為中興之祖茲奉以壽藏師何讓焉余曰臭皮囊終不免歸山僅借此作歸山計漫吟十首識者無誚焉把釣江湖意已休歸來高臥此山頭皮囊漫謂無交涉付與窣波正首丘大事關頭無壯時舟藏於壑力能移從教造物隨分化運去運來聽所之知見紛紛莫妄求死生須是見根由箇中通暢原無我夢裏那容蝶化周南陽塔樣問耽源潭北湘南起話端爭似天王親指出高標丈二任人看劈破洪濛布赤金一龕風雨莫能侵繞簷星月難描貌夜靜軒前寒影深死後何須擇地安乾坤總是一邙山鏡華水月身如幻纍爾殷勤作此關一二三文道路深疏山舌底費沉吟天王此日曾無隱匠作依工百二金丈夫氣宇蓋乾坤古也今兮總一門可問於今誰是主不須死後大招魂收拾傀儡歸去來莫教催迫始心回秦山晉嶺垂千古帝主王候安在哉八角磨盤四面通皇皇如此立吾宗等閒識取歸山去華落華開樂未窮復蘭齊次韻春齊落落擬仙官一枕皇風獨自安對月無心翻貝葉看華有意種幽蘭興亡試問誰相委榮辱何妨爾挂冠芳草空庭垂舊緑清香衣染十分歡同蔚然游紫雲臺次韻紫雲飛盡草披離恍惚窅冥誰是師白骨橫眠生短歎殘碑斜倚發長悲風塵歷歷磨千古江海蕭蕭鎮一時憶我登臨雙目冷幸同朱履踏華枝送晦山禪師住靈隱寺歐峰破額住持久今又幡然入冷泉祖父田園既紹得且栽松竹引風煙寄宋容菴太史楊林渡口老禪翁八載如何信不通想是於今手腳利高提祖印起宗風歲暮寄孫孝穆臘梅西舍放幽香折得一枝無隱藏寄與白沙孫學士嗅來滋味豈情常次韻答聖鐸禪師聖自蜀還南有纂續古尊宿志同氣連枝共一聲玲瓏流出派原清心通先哲誰能似道振時賢孰可爭掩土為親離越國還鄉再過蜀王城他年纂就禪宗史四海駸駸有令名寄武昌黃明震鄂城原是楚王宮深隱還如在萬峰樹色鳥聲清耳目廓然何事不從容寄解元王報菴兼嚴方山小莊修郡乘尼父春秋如日烈馬遷史記若霜寒即今荊國人文物盡在三公潑墨觀次韻答德山枕石禪師何堪指我應前身深愧當年崔氏人翻憶武陵春色好望來猶覺倍精神天王悟俗姓崔寄明克學使名遂功成身退易超生脫死實為難君今若肯言前薦十月霜風撲面寒為汝開喪子子夏哭兒失所目樂天喪子割其腸只知恩愛情難遣不識人生夢一場黃龍興復次定生上人韻祖席飄零剩古臺誅茅斬草賺吾來因憐楚國宗風暮翻念黃龍法道灰有水有山堪卓錫無聲無望好徘徊於今衲被蒙頭坐日對長江捲雪堆黃龍落成為逸老之意次福昌禪師韻闢開三要及三玄宇內聞聲別有天已構一椽念祖德未施大手話難圓荊湖春雨青林茂鄂渚秋風黃菊鮮法道濫觴無此日誰能相共整危顛黃龍徹源泉萬波浩渺嶺南出一派流長濟北來大徹源頭渾不竭運回濁世洗塵埃為黃明震有序子瞻為五祖戒後身其天慧穎脫爽然見於文字茲明震黃公自夢端和尚後身余以其及門問道十有二年往往發言大有由來再來之人迥然不同塵俗特與是句印其自覺而覺於民也大覺方知先世因身前身後一天真臨機廓徹當軒句好去指歸岐路人本懷上書記回蜀作此勉之向上無一事永字有八法如此著手書不計年與月忽然筆生華字字皆龍蛇黃龍與妙喜叢林兩作家處處居記室頭頭撒土沙三關及竹篦如此作生涯傷風犯手者抱首叫阿爺道流須志強一回便承當昔依我晴川今從我天王形影十二年也受其風霜羽毛雖未展爪牙聊已彰云云西蜀去我未許束裝記得昔人曾有語馬祖還鄉道不香寄度門寺法瀾澄首座十首命爾揚州住地藏如何不肯便承當腰包頂笠度門去火種刀耕草木香南能北秀出東山道大名傳天地間今日宗風真一變閒神野鬼鬧禪關兩京法主三帝師肩輿上殿聖迎時跏趺坐見君王重也看於今克盛兒神秀禪師住度門為兩京法主三帝國師趺坐覲君肩輿上殿大通諡號大通人明鏡臺縣絶點塵宇宙至今空浩浩度門唯有一枝春楞伽孤峻峰猶在萬古法場不易磨張說手書碑自見論師竊比大山河依法住持不寂莫首山風穴亦單丁正宗家計渾然別一任庭前草色青少林壁坐九青黃接得神光一箇郎恩大已酬歸故國至今雙桂潑秋香澗水山華活祖意嶺松嵒柏實伽陀分明指點無人會又引闍黎費力多道流住得最高峰俯仰群山眼界空正令提持施棒喝克吾宗者豈無從十載投身爐韛中鍛成一物號靈鋒人來欲問眉間事血濺梵天滴滴紅天王法派慧海原清淨臨波鑑宛然一燈繼古道祖脈自綿延寄懷金龍寺楚菴璨黃葉飄飄落滿階馳懷未已思悠哉不知近日成何事唯見松梢片月來為中旭通宗亦通兮說亦通大千收在一塵中有時展出人天看旭日高縣宇宙紅送劉振公聲名振起傳燈録公道誰家無此心自古聖賢樹妙用直將大地作黃金為旵侍者漫言學富可當事須信多聞亦枉然盡日眼開無別物布毛吹起笑從前為慶侍者莫謂春秋方二十虎生三日氣吞牛大鵬九萬扶搖上豈是搶榆小鷽鳩
