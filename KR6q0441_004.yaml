body:
  text: 嗣法門人原澄等編示衆夏日示衆參禪圖了生死非圖名色也近見學者抱魚目作明珠藏燕石為至寶不但惜而不舍兼亦傲然自是如此病正在膏肓雖有蓋國之明醫而不能瘳矣所以天王三開爐韛百番垂手不見有一箇半箇大悟大徹者實可捫心浩歎也茲者春光忽謝夏景初臨燕語高梁荷香遠沼梅風拂而滿院清麥氣逼而通身爽特與諸人露箇消息良久曰全身脫落無他事眼裏耳裏不是塵復舉大愚芝和尚曰大家聚首喫一莖虀若喚作一莖虀入地獄如箭射師曰全提向上密顯箇中處處現成頭頭受用此從上老宿設機垂手之婆心也然則不喚作一莖虀喚作甚麼憶惜江南三月裏鷓鴣啼處百華香示衆竹戶曉開山色靜柴床午夢覺身輕家風一種無人會添得黃鸝三五聲示衆禪不在參道不在學一任高眠乾坤寥廓復曰黃鸝啼破緑楊煙無限春光如玉削示衆今之學者認箇昭昭靈靈守尸之鬼以當平生便了生死嗟夫殊不知鄭州出曹門遠之遠矣若是英靈漢子氣宇如王將山河大地萬象森羅情與無情聖凡迷悟一齊收來捏作一團然後撒開山河大地還他山河大地萬象森羅還他萬象森羅乃至情與無情聖凡迷悟各各還其本位雖則如此天王看來猶未稱作略且道天王又作麼生神光透徹威音外笑看空生坐石嵒重陽示衆風颯颯雨瀟瀟東籬菊綻正香飄山堂盡日無思算唯與故人守寂寥且道那箇是故人拍膝一下曰參示衆喚作竹篦則觸不喚作竹篦則背不得有語不得無語速道速道古人如此道大似逼死蛇作活龍天王今日看來也不消得遂舉竹篦曰喚作竹篦也得不喚作竹篦也得喚作山河大地也得不喚作山河大地也得喚作諸人鼻孔也得不喚作諸人鼻孔也得不見道此事如珠在盤不滯一隅示衆如來藏裏說不著祖師機下亦顢頇一把柳絲收不得和煙搭在玉闌干且道是祖意是教意復曰參示衆日可冷月可熱衆魔不能壞真說如何是真說莫是早辰喫薄粥於今又覺饑莫是閒持經卷倚松立笑問客從何處來雖然南泉刀下斬貓兒趙州頭上戴草履汝等魔民魔子還可壞否示衆不是心不是佛不是物是箇甚麼芍藥華開菩薩面棕櫚葉散夜叉頭地藏寺千佛閣大雄殿地藏殿落成示衆欲識佛性義當觀時節因緣時節若至偶爾成文時節未至徒勞施設如世尊為箇生死大事時節未至乃上雪山六年苦行鵲巢頂蘆穿膝尋覓不見乃不堪其憂一朝時至向毛頭星上悟得智慧德相人人本具又如雪峰為箇胸中不穩時節未至三登投子九上洞山搆之不得無可奈何一朝時至被嵒頭一拶向鼇山店裏成道又如靈雲為箇娘生鼻孔時節未至三十年來東求西乞了無下手空費草鞋一朝時至向桃華枝上識得根原更不別疑然則從上大聖大賢之人欲作世出世間之事靡不遇因緣時節而成即如山僧為箇千佛大閣時節未至十二年中耿耿於懷心心無間致使入楚來吳風波江上不辭三千里行路難之往返茲者一旦成就如釋重擔如病得汗通身輕安不勝爽快此時山僧歡喜主山神亦歡喜諸人亦歡喜又豈非因緣時節一遇而然哉然則不獨一閣成就即大雄殿地藏殿一時告竣燦然霞映正是一句中具三玄一玄門具三要有權有實有照有用諸人還識權實照用麼地藏佛殿常相對樓閣門前問善財機緣問如何是應時及節句師曰深苑華閒飛蛺蝶長隄柳翠囀黃鸝曰就此借路還家得麼師掌曰看取路頭問如何是賓中賓師曰竹杖芒鞋煙水杳如何是賓中主師曰到處逢人解撒沙如何是主中賓師曰為憐三歲子不惜兩莖眉如何是主中主師曰橫按太阿無剩法大坐當軒孰敢窺問如何是天王境師曰夜深靜聽江濤吼如何是境中人師曰日午鼾眠鷗夢清孟太守問人人俱有佛性因甚不見師拈起龍眼曰要見便見守曰者是平常日用的葉司李在傍曰且喜堂翁今日瞥地師曰貧道卻被二位看破三月三垂問山僧昨夜得一夢夢見靈官與真武慶生官以兩手捧一盤而頭俯伏於地曰世間所有者小卒不敢獻上頃獲一寶且不論其價尚人所不識顓申鄙悃敢祝千秋聲未盡忽被迅雷驚醒試問靈官所獻是甚麼寶世間無有人所不識自代曰春風迎竹戶夜雨滴華心問要緊處乞師一言師曰穿衣喫飯屙屎放尿問僧汝試放箇光看僧打一圓相師曰漆桶上又加了一道箍僧無語師呵呵大笑問眼光落地時向甚麼處去師擊露柱曰向此去問風吹柳絮毛毬走雨打梨華蛺蝶飛未審明甚麼邊事師曰換卻汝眼睛穿卻汝鼻孔曰不會師曰漆桶不快問天王也恁麼道龍潭也恁麼道未審道箇甚麼師曰山色湖光開法眼鳥啼華笑見雲門問荊州古戰場何日干戈息師打一拂子曰但自歇心狂四海清如鏡曰野老不知堯舜力鼕鼕打鼓祭江神去也師復打曰非汝境界問如何是地藏境師曰千竿修竹插雲漢百鳥投棲自遠來如何是境中人師曰灰頭土面無堪用要拄人間稱獨尊如何是人中意師曰等閒拈出烏梅子換卻諸人眼裏睛問一葉落天下秋不風流處也風流時如何師曰汝作麼生風流曰坐看空庭黃葉舞穿衣喫飯不知名師曰苦哉佛陀耶問僧現成公案道道曰雨過蒼苔溼師曰引不著僧喝師曰喝不著僧又喝師曰放汝三十佛事為達磨開光梁皇殿上道不識明明一語不覆藏少室峰前分皮髓全機顯露在當陽自此光明照不夜人間天上更輝煌燈燈續焰傳千古赫赫流芳播萬方然則既有如此莫大光明今日何須不肖遠孫始可為其開光雖然要假兒孫腳下行點開灼破四天下為沙彌剃度賈島昔年曾反俗汝何又要入門來塵埃斷處髮鬚斷了悟凡胎即聖胎為含石起龕當時恁麼來面目撲撲覺華開於今恁麼去腳底雲山俱踏碎一朝驀爾歸家搖手正謂適來夫子時也適去夫子順也而又安得言之死乎生乎且道臨行又作麼生常樂地中留不住輕然移步往他方舉火炯炯光明不覆遮乾坤洞燭絶千差好著眼漫生華就中消息露些些直下與麼會去石中有璧豈能含精潤頭頭皆受用其或未然攛火炬曰一句分明親切語殷勤付與丙丁公師野游見白骨數具乃拾而焚之舉火曰骷髏骷髏一臥荒郊不計秋於今指汝歸家路麥浪堆中翠色浮為雲石起龕兼請祭嗚呼子之為人兮朴且剛子之處世兮淡以常子之染衣兮潔而淨子之斷髮兮志猶皇奈塵緒縛而無計脫兮日逐奔忙其幾幾覺悟蒼生之不遠兮欲修以未遑詎料忽焉殂落兮令人淚出痛腸嗚呼榻冷窗寒兮信吹黃粱吾今告汝真言兮確實還鄉者邊那邊常光不減其赫然兮又何悲以何傷影落落聲揚揚家山行到見空王拽杖引之舉火任爾英雄與傑士到頭難免換皮囊今朝劫火洞然發觸著通身放寶光好計取快承當千古萬古永莫忘為恆作頭舉火魯班門下已經弄鑿拈斧天王寺中曾來挂搭披衣昨夜笑而復舞手今朝偃而亦攢眉世緣既已謝宣合悟真機雲冉冉草菲菲江北江南皆寶所乘時贏得莫空歸其人卒死為河南居士起棺人人本有靈光寧容更加半點處處無窮受用何妨再進一步踢破生死關截斷凡聖路此界他方人間天上一任橫行何分僧俗若也會得棺材瞪眼原非妙信步超方須自行舉火一生一死大須難結角羅紋火內看欲問亡靈何處去翩然端直到河南為亡僧舉火生前多為別人忙死後枯形實可傷一副皮囊直甚物煙消火滅看郎當雖然山僧更為點出金剛不壞眼睛令汝照天照地擲下火炬曰一朵曇華火內香為澄源起龕撒手長安古路頭因緣大事一時休臨行句子分明薦一帶青青草色浮舉火覺海真空澄源湛寂覿面全提原無隱諱桃紅陌上兮歷歷無生之旨柳緑溪頭兮明明不滅之機直下豁然親領會全身末後看光輝便燒為余學士起棺嚴風凜凜碧落輝輝大道淵源廓露全機悟之在人兮頭頭是路迷之滯蹟兮處處無依茫茫執而不反兮漂漂乎何止明明茲以揭示兮沒沒乎無違朝聞夕死兮榮而有幸啓手啓足兮信然全歸以拄杖擊棺曰臥在此中原不妙密移一步看龍飛為明覺封龕萬法本閒華鳥靜唯人自鬧往來忙而今收拾歸家去一髮一絲都掩藏起龕行人萬里送春歸一路華飛點翠衣急急向前消息好莫教遲鈍上頭機舉火佛號大覺汝名明覺先覺後覺其揆一也於今指汝歸何處火焰堆中是道場為亡僧舉火北地生南方死一靈性了無依舉火炬曰承此火光三昧力了然證取潑天機為觀指起龕蘄州是汝生長處揚州是汝游行處真州是汝回首處且道那裏是汝常樂處前頭更有最高峰殷勤行到自怡悅舉火為最上乘人說最上乘法觀指其為最上乘者況與我僅一江之隔亦乃為鄉人也安得不互相發明末後大事觀指汝勤求禮拜為最上乘歟顓心持誦為最上乘歟堅守毗尼為最上乘歟乃至造象印經種種功德亦為最上乘歟若最上乘者生不知來處死不知去處實人生至大之事今既撒手宜當體悉舉火炬曰觀指本來面目覿體靈光我今為汝真實指點終不虛也為了然煆骨盤走珠兮珠走盤信手拈來顆顆圓非但汝今獨解了十方諸佛體皆然體皆然體皆然火焰光中生白蓮為王吏科起棺富貴功名當等閒難留生死片時間兒嬌室內腸幾折父老堂中淚欲潸四十一年真作夢百千萬劫到家山而今琴劍誠無用望斷秋風人不還雖然一色杏華紅十里狀元歸去馬如飛下壙到家田地不多爭七尺深深埋白雲莫謂今朝空手去文章千古一匡墳為指印封缸如我按指海印發光汝暫舉心塵勞先起只如指禪建五臺梵剎於八省通衢之地開古林戒壇於衰殘落莫之秋是塵勞先起耶海印發光耶今日總歸瓦棺內任從佛眼覷無門為大智舉火般若大智如大火聚近之通身燎卻豈容立地而思智禪智禪知不知曇華一朵插頭時
